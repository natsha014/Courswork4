<!-- sender/templates/sender/message_list.html -->
{% extends 'sender/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="display-4">Мои сообщения</h1>
    </div>

    <div class="row">
        {% for message in object_list %}
        <div class="col-md-6 col-lg-4 mb-4">
            <div class="card h-100 shadow-sm">
                <div class="card-header d-flex justify-content-between">
                    <small class="text-muted">ID: {{ message.id }}</small>
                </div>
                <div class="card-body">
                    <h5 class="card-title text-truncate">{{ message.subject }}</h5>
                    <p class="card-text text-muted small">
                        {{ message.body|truncatechars:100 }}
                    </p>
                    <h6>Владелец: {{ message.owner }}</h6>
                </div>
                <div class="card-footer bg-transparent border-top-0 pb-3">
                    <div class="btn-group w-100">
                        <a href="{% url 'sender:message_detail' message.pk %}" class="btn btn-sm btn-outline-primary">Просмотр</a>
                    </div>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center">
            <div class="alert alert-info">У вас пока нет созданных сообщений</div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
